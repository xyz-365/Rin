<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>GeoGebra</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#fff;overflow:hidden;}
  #ggb-element{width:100%;height:100%;}
</style>
</head>
<body>
<div id="ggb-element"></div>
<script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var app=new GGBApplet({
    appName:"classic",
    width:window.innerWidth,
    height:window.innerHeight,
    showToolBar:p.get('toolbar')!=='false',
    customToolBar:p.get('tools')||"",
    showToolBarHelp:false,showAlgebraInput:false,showMenuBar:false,
    allowStyleBar:false,showResetIcon:false,showFullscreenButton:true,
    enableFileFeatures:false,language:"zh_CN",
    filename:"https://p.jgd.cc.cd/file/"+p.get('file')
  },true);
  app.inject('ggb-element','preferhtml5');
})();
</script>
</body>
</html>
