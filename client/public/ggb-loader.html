<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoGebra 交互演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #ggb-container {
            width: 100%;
            max-width: 800px;
            height: 600px; /* 会被 JS 动态覆盖 */
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
        }
        .loading-tip {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 16px;
        }
        .error-tip {
            text-align: center;
            color: #d32f2f;
            padding: 40px 20px;
            font-size: 16px;
            display: none;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            #ggb-container {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ggb-container">
        <div class="loading-tip" id="loading-tip">
            <span class="spinner"></span> 正在加载 GeoGebra 应用，请稍候...
        </div>
        <div class="error-tip" id="error-tip">
            ⚠️ 错误：未指定要加载的文件。<br>
            <span style="font-size:14px;color:#888;">请在 URL 后添加 <code style="background:#f0f0f0;padding:2px 6px;border-radius:3px;">?file=你的文件名.ggb</code> 参数</span>
        </div>
    </div>

    <!-- 使用官方 CDN，确保最新版本 -->
    <script src="https://ggb123.cn/apps/deployggb.js">
    </script>

    <script>
        window.addEventListener("load", function() {

            // ---------- 1. 解析 URL 参数 ----------
            var urlParams = new URLSearchParams(window.location.search);
            var fileName = urlParams.get('file');
            var customHeight = urlParams.get('height');
            var showToolBarParam = urlParams.get('toolbar');  // 'true' 或 'false'
            var customTools = urlParams.get('tools');         // 如 '0 1 2'

            // ---------- 2. 基础地址（你的 .ggb 文件存放位置） ----------
            var baseUrl = "https://p.jgd.cc.cd/file/";

            // ---------- 3. 获取容器并计算尺寸 ----------
            var container = document.getElementById('ggb-container');

            // 获取容器实际宽度（考虑 padding 和 border）
            var containerWidth = container.clientWidth || window.innerWidth || 800;
            // 限制最大宽度 800px，防止在平板上过度拉伸
            var finalWidth = Math.min(containerWidth, 800);

            // 按 4:3 比例计算高度，最小 300px
            var finalHeight = Math.max(300, finalWidth * 0.75);

            // 如果 URL 中指定了高度，则覆盖
            if (customHeight) {
                var h = parseInt(customHeight);
                if (!isNaN(h) && h > 100) {
                    finalHeight = h;
                }
            }

            // 设置容器高度
            container.style.height = finalHeight + 'px';

            // ---------- 4. 处理 file 参数 ----------
            if (!fileName) {
                document.getElementById('loading-tip').style.display = 'none';
                document.getElementById('error-tip').style.display = 'block';
                return;
            }

            var fullFileUrl = baseUrl + fileName;

            // ---------- 5. 构建 GeoGebra 参数 ----------
            var params = {
                "appName": "classic",
                "width": finalWidth,
                "height": finalHeight,
                // ★★★ 核心：scale 让内容适配容器，解决四周空白 ★★★
                "scale": containerWidth / 800,
                "showAlgebraInput": false,
                "showMenuBar": false,
                "allowStyleBar": false,
                "showResetIcon": false,
                "enableFileFeatures": false,
                "showFullscreenButton": true,
                "filename": fullFileUrl
            };

            // ---------- 6. 工具栏控制 ----------
            // 判断是否显示工具栏
            var showToolBar = (showToolBarParam !== 'false'); // 默认为 true
            if (showToolBar) {
                params.showToolBar = true;
                params.showToolBarHelp = false;
                // 如果传入了 tools，则使用自定义工具列表；否则清空工具栏（只保留全屏按钮）
                if (customTools) {
                    params.customToolBar = customTools;
                } else {
                    params.customToolBar = "";
                }
            } else {
                params.showToolBar = false;
                params.showFullscreenButton = false; // 隐藏工具栏时也隐藏全屏按钮（避免孤立的按钮）
            }

            // ---------- 7. 注入 applet ----------
            var applet = new GGBApplet(params, true);
            applet.inject('ggb-container');

            // ---------- 8. 超时处理（如果加载过慢） ----------
            setTimeout(function() {
                var container = document.getElementById('ggb-container');
                if (container.querySelector('#loading-tip')) {
                    var tip = document.getElementById('loading-tip');
                    if (tip) {
                        tip.innerHTML = '⏳ 加载时间较长，请检查网络后刷新重试...';
                    }
                }
            }, 30000);

            // ---------- 9. （可选）窗口 resize 时重新缩放 ----------
            // 简单防抖：若窗口变化超过 50px，重新加载页面（或可更优雅地调用 applet.setSize）
            var lastWidth = finalWidth;
            window.addEventListener('resize', function() {
                var newWidth = document.getElementById('ggb-container').clientWidth || window.innerWidth;
                if (Math.abs(newWidth - lastWidth) > 50) {
                    // 简单刷新，也可以使用更复杂的动态调整
                    // 这里为了防止频繁刷新，不做处理，用户可自行扩展
                }
            });

        });
    </script>
</body>
</html>
