<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoGebra 交互演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }
        #ggb-container {
            width: 100%;
            background-color: #ffffff;
            position: relative;
        }
        .loading-tip {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .error-tip {
            text-align: center;
            color: #d32f2f;
            padding: 40px 20px;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: none;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="ggb-container">
        <div class="loading-tip" id="loading-tip">
            <span class="spinner"></span> 正在加载 GeoGebra 应用，请稍候...
        </div>
        <div class="error-tip" id="error-tip">
            &#x26a0;&#xfe0f; 错误：未指定要加载的文件。<br>
            <span style="font-size:14px;color:#888;">请在 URL 后添加
                <code style="background:#f0f0f0;padding:2px 6px;border-radius:3px;">?file=你的文件名.ggb</code>
                参数
            </span>
        </div>
    </div>

    <!-- GeoGebra 官方部署脚本 -->
    <script src="https://cdn.geogebra.org/apps/deployggb.js"></script>

    <script>
    (function () {
        "use strict";

        // ========== 1. 解析 URL 参数 ==========
        var urlParams = new URLSearchParams(window.location.search);
        var fileName        = urlParams.get('file');
        var customHeight    = urlParams.get('height');
        var showToolBarParam = urlParams.get('toolbar');
        var customTools     = urlParams.get('tools');
        var baseUrl         = "https://p.jgd.cc.cd/file/";

        // ========== 2. 获取 DOM 元素 ==========
        var container  = document.getElementById('ggb-container');
        var loadingTip = document.getElementById('loading-tip');
        var errorTip   = document.getElementById('error-tip');

        // ========== 3. 计算尺寸 ==========
        function calcSize() {
            var w = container.clientWidth || window.innerWidth || 800;
            w = Math.min(w, 800);
            var h;
            if (customHeight) {
                h = parseInt(customHeight, 10);
                if (isNaN(h) || h < 100) {
                    h = Math.max(300, w * 0.75);
                }
            } else {
                h = Math.max(300, w * 0.75);
            }
            return { width: w, height: h };
        }

        var size = calcSize();
        container.style.height = size.height + 'px';

        // ========== 4. 参数校验 ==========
        if (!fileName) {
            loadingTip.style.display = 'none';
            errorTip.style.display = 'block';
            return;
        }

        // ========== 5. 构建 GeoGebra 参数 ==========
        var showToolBar = (showToolBarParam !== 'false');

        var ggbParams = {
            appName: "classic",
            width: size.width,
            height: size.height,
            showAlgebraInput: false,
            showMenuBar: false,
            allowStyleBar: false,
            showResetIcon: false,
            enableFileFeatures: false,
            showFullscreenButton: true,
            filename: baseUrl + fileName,
            showToolBar: showToolBar,
            showToolBarHelp: false,
            customToolBar: showToolBar ? (customTools || "") : "",
            language: "zh_CN",
            showLogging: false,
            useBrowserForJS: true,
            appletOnLoad: function () {
                // Applet 加载完成后隐藏 loading 提示
                loadingTip.style.display = 'none';
            }
        };

        // ========== 6. 创建并注入 Applet ==========
        var ggbApp = new GGBApplet(ggbParams, true);
        ggbApp.inject(container, 'preferhtml5');

        // ========== 7. 获取 applet 实例（供 resize 调用） ==========
        var appletReady = false;
        var appletObj   = null;

        var checkReady = setInterval(function () {
            try {
                appletObj = ggbApp.getAppletObject();
                if (appletObj) {
                    appletReady = true;
                    clearInterval(checkReady);
                }
            } catch (e) {
                // 尚未就绪，继续等待
            }
        }, 200);

        // ========== 8. 窗口大小变化处理 ==========
        var resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                var newSize = calcSize();
                container.style.height = newSize.height + 'px';

                if (appletReady && appletObj) {
                    try {
                        appletObj.setSize(newSize.width, newSize.height);
                    } catch (e) {
                        console.log('setSize failed:', e);
                    }
                }
            }, 300);
        });

    })();
    </script>
</body>
</html>
