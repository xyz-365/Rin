<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GeoGebra</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#fff; overflow:hidden; }
  /* 关键：scaleContainerClass 对应的容器，GeoGebra 会按这个容器实际大小渲染 */
  #ggb-scale{
    width:100%;
    height:100%;
  }
  /* 真正放 applet 的容器 */
  #ggb-element{
    width:100%;
    height:100%;
  }
  .loading-tip{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#666; font-size:15px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .error-tip{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center;
    color:#d32f2f; font-size:15px; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
</style>
</head>
<body>
  <div id="ggb-scale">
    <div class="loading-tip" id="loading-tip">正在加载 GeoGebra…</div>
    <div class="error-tip" id="error-tip">未指定 file 参数</div>
    <div id="ggb-element"></div>
  </div>

  <script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
  <script>
  (function(){
    var p = new URLSearchParams(location.search);
    var file = p.get('file');
    if(!file){
      document.getElementById('loading-tip').style.display='none';
      document.getElementById('error-tip').style.display='flex';
      return;
    }
    var showTB = p.get('toolbar') !== 'false';
    var params = {
      appName:"classic",
      // 不写 width/height，改用 scaleContainerClass（官方响应式方案）
      scaleContainerClass:"ggb-scale",
      filename:"https://p.jgd.cc.cd/file/" + file,
      showToolBar: showTB,
      customToolBar: showTB ? (p.get('tools')||"") : "",
      showToolBarHelp:false,
      showAlgebraInput:false,
      showMenuBar:false,
      allowStyleBar:false,
      showResetIcon:false,
      showFullscreenButton:true,
      enableFileFeatures:false,
      language:"zh_CN",
      appletOnLoad:function(){
        document.getElementById('loading-tip').style.display='none';
      }
    };
    var app = new GGBApplet(params, true);
    app.inject('ggb-element','preferhtml5');
  })();
  </script>
</body>
</html>
