<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra 交互演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #ggb-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
        }
        .loading-tip {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 16px;
        }
        .error-tip {
            text-align: center;
            color: #d32f2f;
            padding: 40px 20px;
            font-size: 16px;
            display: none;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            #ggb-container {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ggb-container">
        <div class="loading-tip" id="loading-tip">
            <span class="spinner"></span> 正在加载 GeoGebra 应用，请稍候...
        </div>
        <div class="error-tip" id="error-tip">
            ⚠️ 错误：未指定要加载的文件。<br>
            <span style="font-size:14px;color:#888;">请在 URL 后添加 <code style="background:#f0f0f0;padding:2px 6px;border-radius:3px;">?file=你的文件名.ggb</code> 参数</span>
        </div>
    </div>

    <script src="https://ggb123.cn/apps/deployggb.js">
    </script>

    <script>
        window.addEventListener("load", function() {

            // 获取 URL 参数
            var urlParams = new URLSearchParams(window.location.search);
            var fileName = urlParams.get('file');
            var customHeight = urlParams.get('height');
            
            // ★★★ 新增：读取工具栏控制参数 ★★★
            var showToolBar = urlParams.get('toolbar');      // 'true' 或 'false'
            var customTools = urlParams.get('tools');        // 如 '0 1 2 3 4'

            var baseUrl = "https://p.jgd.cc.cd/file/";

            var container = document.getElementById('ggb-container');
            var containerWidth = container.clientWidth;
            var defaultHeight = Math.min(600, Math.max(400, containerWidth * 0.75));

            var finalHeight = customHeight ? parseInt(customHeight) : defaultHeight;
            container.style.height = finalHeight + 'px';

            if (!fileName) {
                document.getElementById('loading-tip').style.display = 'none';
                document.getElementById('error-tip').style.display = 'block';
                return;
            }

            var fullFileUrl = baseUrl + fileName;

            // ★★★ 构建 params ★★★
            var params = {
    "appName": "classic",
    "width": containerWidth,
    "height": finalHeight,
    "scale": containerWidth / 800,        // ← 新增：自动缩放
    "showToolBar": showToolBar !== 'false',
    "showToolBarHelp": false,
    "showFullscreenButton": true,
    "customToolBar": customTools || "",
    "showAlgebraInput": false,
    "showMenuBar": false,
    "allowStyleBar": false,
    "showResetIcon": false,
    "enableFileFeatures": false,
    "filename": fullFileUrl
};

            // ============================================================
            // 1. 控制工具栏显示/隐藏
            // ============================================================
            // 如果 URL 中 toolbar=false，隐藏工具栏
            if (showToolBar === 'false') {
                params.showToolBar = false;
                // 隐藏工具栏时，全屏按钮可能也被隐藏，通过 allowFullscreen 让浏览器支持全屏
                params.showFullscreenButton = false;  // 隐藏 GeoGebra 自带全屏按钮
            } else {
                params.showToolBar = true;
                params.showToolBarHelp = false;
                params.showFullscreenButton = true;
            }

            // ============================================================
            // 2. 自定义工具（仅在工具栏显示时生效）
            // ============================================================
            if (showToolBar !== 'false' && customTools) {
                // 如果传入了 tools 参数，使用自定义工具列表
                params.customToolBar = customTools;
            } else if (showToolBar !== 'false' && !customTools) {
                // 如果工具栏显示但未传入 tools，使用默认工具（空工具栏，只留全屏按钮）
                params.customToolBar = "";
            }

            // ============================================================
            // 3. 如果工具栏隐藏，但仍然想用浏览器全屏，可以在这里添加备用方案
            // ============================================================
            // (不需要额外操作，allowfullscreen 已在 iframe 中启用)

            // 创建 applet
            var applet = new GGBApplet(params, true);
            applet.inject('ggb-container');

            setTimeout(function() {
                var container = document.getElementById('ggb-container');
                if (container.querySelector('#loading-tip')) {
                    var tip = document.getElementById('loading-tip');
                    if (tip) {
                        tip.innerHTML = '⏳ 加载时间较长，请检查网络后刷新重试...';
                    }
                }
            }, 30000);

        });
    </script>
</body>
</html>
