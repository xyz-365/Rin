<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GeoGebra</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#fff; overflow:hidden; }
  /* 响应式占位容器：宽100%，高按 4:3 */
  #ggb-scale{
    width:100%;
    padding-bottom:75%;   /* 改这里=改比例，比如 56.25% 是 16:9 */
    position:relative;
  }
  /* GeoGebra 注入的元素必须绝对铺满占位容器 */
  #ggb-element{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .loading-tip{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#666; font-size:15px; z-index:5;
  }
  .error-tip{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:#d32f2f; font-size:15px; padding:20px; text-align:center;
  }
</style>
</head>
<body>
  <div id="ggb-scale">
    <div class="loading-tip" id="loading-tip">正在加载 GeoGebra…</div>
    <div class="error-tip" id="error-tip">未指定 file 参数</div>
    <div id="ggb-element"></div>
  </div>

  <script src="https://ggb123.cn/apps/deployggb.js"></script>
  <script>
  (function(){
    var p = new URLSearchParams(location.search);
    var file = p.get('file');
    if(!file){
      document.getElementById('loading-tip').style.display='none';
      document.getElementById('error-tip').style.display='flex';
      return;
    }
    var showTB = p.get('toolbar') !== 'false';

    var params = {
      appName:"classic",
      scaleContainerClass:"ggb-scale",   // ← 关键，不写 width/height
      autoHeight:true,
      allowUpscale:false,
      filename:"https://p.jgd.cc.cd/file/" + file,
      showToolBar: showTB,
      customToolBar: showTB ? (p.get('tools')||"") : "",
      showToolBarHelp:false,
      showAlgebraInput:false,
      showMenuBar:false,
      allowStyleBar:false,
      showResetIcon:false,
      showFullscreenButton:true,
      enableFileFeatures:false,
      language:"zh_CN",
      appletOnLoad:function(){
        document.getElementById('loading-tip').style.display='none';
        // 手机上首次注入后强制重算一次环境尺寸
        try { this.recalculateEnvironments(); } catch(e){}
        postHeight();
      }
    };

    var app = new GGBApplet(params, true);
    app.inject('ggb-element','preferhtml5');

    // 把真实高度发给父 iframe（父页用 postMessage 接）
    function postHeight(){
      var real = document.getElementById('ggb-scale').getBoundingClientRect().height;
      if(parent !== window){
        parent.postMessage({type:'ggb-resize', height: Math.ceil(real)}, '*');
      }
    }
    window.addEventListener('resize', function(){
      setTimeout(function(){
        try { app.getAppletObject().recalculateEnvironments(); } catch(e){}
        postHeight();
      }, 200);
    });
    window.addEventListener('orientationchange', function(){
      setTimeout(function(){
        try { app.getAppletObject().recalculateEnvironments(); } catch(e){}
        postHeight();
      }, 400);
    });
  })();
  </script>
</body>
</html>
